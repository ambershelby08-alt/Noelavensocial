name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (integer, increment each release)'
        required: true
        default: '1'
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: artifacts/noelaven
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm run build

      - name: Install Capacitor CLI
        run: pnpm add -g @capacitor/cli

      - name: Sync Capacitor
        working-directory: artifacts/noelaven
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > artifacts/noelaven/android/app/noelaven-release.keystore

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: artifacts/noelaven/android
        run: chmod +x ./gradlew

      - name: Set version
        working-directory: artifacts/noelaven/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.version_name }}"/' build.gradle

      - name: Build release AAB
        working-directory: artifacts/noelaven/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/artifacts/noelaven/android/app/noelaven-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: noelaven-${{ github.event.inputs.version_name }}-(${{ github.event.inputs.version_code }}).aab
          path: artifacts/noelaven/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: spark
    description: Daily Spark prompt
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /spark/today:
    get:
      operationId: getSparkToday
      tags: [spark]
      summary: Get today's AI-generated Daily Spark prompt
      responses:
        "200":
          description: Today's spark prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparkPrompt"
components:
  schemas:
    SparkPrompt:
      type: object
      properties:
        prompt:
          type: string
        date:
          type: string
      required:
        - prompt
        - date
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

